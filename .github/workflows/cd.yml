name: CD - Build & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types:
      - completed

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npm run prisma:generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_URL }}/giiveaway/api:latest
            ${{ secrets.HARBOR_URL }}/giiveaway/api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.HARBOR_URL }}/giiveaway/api:latest
          cache-to: type=inline

      - name: Build & Push Front
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/mobile/Dockerfile
          push: true
          tags: |
            ${{ secrets.HARBOR_URL }}/giiveaway/front:latest
            ${{ secrets.HARBOR_URL }}/giiveaway/front:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.HARBOR_URL }}/giiveaway/front:latest
          cache-to: type=inline

  update-gitops:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ThysmaJS/k3s-gitops-lab
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tags
        run: |
          sed -i "s|image: ${{ secrets.HARBOR_URL }}/giiveaway/api:.*|image: ${{ secrets.HARBOR_URL }}/giiveaway/api:${{ github.event.workflow_run.head_sha }}|g" \
            gitops/apps/giiveaway/deployment.yaml
          sed -i "s|image: ${{ secrets.HARBOR_URL }}/giiveaway/front:.*|image: ${{ secrets.HARBOR_URL }}/giiveaway/front:${{ github.event.workflow_run.head_sha }}|g" \
            gitops/apps/giiveaway/deployment.yaml

      - name: Commit and push
        run: |
          cd gitops
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add apps/giiveaway/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: deploy giiveaway ${{ github.event.workflow_run.head_sha }}"
          git push