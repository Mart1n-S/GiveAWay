name: CI

on:
  push:
    branches: [develop, staging, prod]
  pull_request:
    types: [opened, synchronize, reopened]

# Variables d'environnement globales pour le projet
env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_UI: false # Désactive l'interface interactive pour des logs propres
  DATABASE_URL: "postgresql://postgres:password@localhost:5433/giveaway_test?schema=public"
  NODE_ENV: test
  JWT_ACCESS_SECRET: test_access_secret
  JWT_REFRESH_SECRET: test_refresh_secret

jobs:
  # Job 1 : Vérifie que le code compile et respecte les règles de style
  build-and-quality:
    name: Build & Quality
    runs-on: ubuntu-latest

    steps:
      # Récupère le code source du repository
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installe Node.js avec la mise en cache des modules npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Installe les dépendances du monorepo de manière stricte
      - name: Install Dependencies
        run: npm ci

      # Gère le cache interne de Turbo pour accélérer les futurs builds
      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prépare les types Prisma nécessaires à la compilation
      - name: Prisma Generate
        run: npm run prisma:generate

      # Compile l'ensemble des apps et packages
      - name: Build
        run: npx turbo run build --filter=./packages/* --filter=./apps/* --cache-dir=".turbo"

      # Lance ESLint et la vérification des types TypeScript
      - name: Lint & Type Check
        run: |
          npx turbo run lint --cache-dir=".turbo" -- --quiet
          npx turbo run check-types --cache-dir=".turbo"

      # Sauvegarde les fichiers compilés pour les jobs suivants
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/api/dist
            packages/shared/dist
          retention-days: 1

  # Job 2 : Validation de la logique métier (Tests isolés de l'API et du code partagé)
  tests-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: build-and-quality

    # Lance une base de données temporaire pour les tests E2E de l'API
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: giveaway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Récupère le cache Turbo pour ne relancer que les tests modifiés
      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Récupère le build généré au Job 1
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      # Synchronise le schéma de la base de données de test
      - name: Prisma Generate & DB Push
        run: |
          npm run prisma:generate
          npx prisma db push --schema=apps/api/prisma/schema.prisma --url="$DATABASE_URL" --accept-data-loss

      # Lance les tests unitaires et génère les rapports de couverture LCOV
      - name: Run Unit Tests with Coverage
        run: npx turbo run test:cov --filter=!mobile --cache-dir=".turbo"

      # Sauvegarde les rapports de couverture pour SonarCloud
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            packages/shared/coverage/lcov.info
          retention-days: 1

      # Exécute les tests de bout en bout (E2E) de l'API (Jest)
      - name: Run E2E Tests backend
        run: npm run test:e2e

  # Job 3 : Validation de l'interface utilisateur (Simulation d'un utilisateur réel)
  tests-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: build-and-quality
    timeout-minutes: 60
    env:
      # Obligatoire pour qu'Expo Router puisse bundler le Web
      NODE_ENV: development
    
    # Base de données nécessaire car Playwright utilise la vraie API
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: giveaway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Prépare l'API pour que Playwright puisse la démarrer via webServer
      - name: Prisma Generate
        run: npm run prisma:generate

      - name: Build API
        run: npx turbo run build --filter=api --filter=./packages/* --cache-dir=".turbo"

      # Injecte le schéma dans la base de données
      - name: Prisma DB Push
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma --url="$DATABASE_URL" --accept-data-loss

      # Installe le moteur de rendu Chromium pour les tests Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Lance les serveurs et exécute les scénarios de tests E2E mobiles
      - name: Run Playwright Tests (mobile)
        run: npx playwright test --config=apps/mobile/playwright.config.ts --project=chromium
        env:
          EXPO_ROUTER_APP_ROOT: "app"
          NODE_ENV: "development"
          USE_DETERMINISTIC_OTP: "true"
          EXPO_PUBLIC_API_URL: "http://localhost:3000"
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "fake-client-id-for-ci"

      # Sauvegarde les captures d'écran et vidéos en cas d'échec des tests
      - name: Upload Playwright Report (mobile)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: apps/mobile/playwright-report/
          retention-days: 7

      # Reset + seed de la DB de test puis exécute les tests E2E admin.
      # Le webServer du playwright.config admin démarre l'API + Vite.
      - name: Run Playwright Tests (admin)
        run: npm run test:e2e --workspace=apps/admin

      - name: Upload Playwright Report (admin)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin
          path: apps/admin/playwright-report/
          retention-days: 7

  # Job 4 : Analyse globale de la qualité et de la sécurité (SonarCloud)
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [build-and-quality, tests-backend, tests-frontend]
    if: success()

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Récupère les fichiers de couverture générés au Job 2
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage-reports

      # Place les rapports aux emplacements configurés dans sonar-project.properties
      - name: Move coverage files
        run: |
          mkdir -p apps/api/coverage packages/shared/coverage
          cp coverage-reports/apps/api/coverage/lcov.info apps/api/coverage/lcov.info
          cp coverage-reports/packages/shared/coverage/lcov.info packages/shared/coverage/lcov.info

      # Déclenche l'analyse SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}